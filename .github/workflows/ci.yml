name: CI Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff pytest

      - name: Static Analysis & Code Linting
        run: |
          ruff check .

      - name: Run Test Suite (Unit & Integration)
        run: |
          pytest tests/ -v

      - name: Run Retrieval Ablation Benchmark
        run: |
          python -m app.cli eval

      - name: Verify Sleep-Replay Consolidation
        run: |
          python -m app.cli consolidate

      - name: Verify Proactive Code Memory (PR Check)
        run: |
          python -m app.cli pr-check -f services/checkout/OrderClient.py
