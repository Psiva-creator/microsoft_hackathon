name: CI Pipeline

on:
  push:
    branches: [main, "member-*", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Lint, Test & Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint & Format Check
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Run Pytest Suite
        run: |
          PYTHONPATH="" .venv/bin/pytest tests/ -v

      - name: Run Retrieval Ablation Benchmark
        run: |
          PYTHONPATH="" .venv/bin/python -m app.cli eval

      - name: Verify Sleep-Replay Consolidation
        run: |
          PYTHONPATH="" .venv/bin/python -m app.cli consolidate

      - name: Verify Proactive Code Memory (PR Check)
        run: |
          PYTHONPATH="" .venv/bin/python -m app.cli pr-check -f services/checkout/OrderClient.py
