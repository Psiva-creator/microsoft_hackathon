name: Proactive PR Risk Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-risk-analysis:
    name: Code Memory Outage Risk Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Get Changed Files
        id: changed-files
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Run PR Risk Check
        run: |
          if [ -n "${{ steps.changed-files.outputs.files }}" ]; then
            PYTHONPATH="" .venv/bin/python -m app.cli pr-check --files ${{ steps.changed-files.outputs.files }}
          else
            echo "No changed files detected."
          fi
