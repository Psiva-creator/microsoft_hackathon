[project]
name = "incident-agent"
version = "0.1.0"
description = "Incident Response Agent with Brain-Inspired Memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "anthropic>=0.34.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
full = [
    "uvicorn[standard]>=0.30.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "slack-bolt>=1.20.0",
    "gitpython>=3.1.43",
    "typer>=0.12.0",
    "rich>=13.8.0",
]

[project.scripts]
cli = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.api.main:app"
